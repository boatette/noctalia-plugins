id = "boatette/omarchy-import"
name = "Omarchy Import"
version = "1.0.0"
plugin_api = 14
author = "boatette"
license = "MIT"
dependencies = ["omarchy-import"]
tags = ["theme", "wallpaper", "palette", "neovim"]
icon = "palette"
description = "Browse the omarchy theme catalog and import a theme as a noctalia palette, a wallpaper folder and a neovim colorscheme."

[[setting]]
key = "helper_command"
type = "string"
label_key = "settings.helper_command.label"
description_key = "settings.helper_command.description"
default = "omarchy-import"

[[setting]]
key = "nix_repo"
type = "folder"
label_key = "settings.nix_repo.label"
description_key = "settings.nix_repo.description"
default = "~/nix"

[[setting]]
key = "wallpaper_root"
type = "folder"
label_key = "settings.wallpaper_root.label"
description_key = "settings.wallpaper_root.description"
default = "~/Pictures/Wallpapers"

[[panel]]
id = "browser"
entry = "panel.luau"
width = 1000
height = 780
placement = "attached"
position = "auto"

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "palette"

  [[widget.setting]]
  key = "show_tooltip"
  type = "bool"
  label_key = "settings.show_tooltip.label"
  description_key = "settings.show_tooltip.description"
  default = true
